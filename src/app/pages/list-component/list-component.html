<div style="display:flex; align-items:center; gap:12px;">
  <h3 style="margin:0;">Lista osób</h3>
  <span style="flex:1;"></span>
  <a mat-raised-button color="primary" routerLink="/add">Dodaj osobę</a>
</div>

<mat-divider style="margin: 12px 0;"></mat-divider>

@if (persons.length === 0) {
  <p>Brak zapisanych osób.</p>
} @else {
  <mat-nav-list>
    @for (p of persons; track $index) {
      <div style="display:flex; align-items:center;">
        <a mat-list-item [routerLink]="['/details', $index]">
          {{ p.firstName }} {{ p.familyName }} (wiek: {{ p.age }})
        </a>

        <button mat-icon-button color="warn" type="button" (click)="delete($index)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    }
  </mat-nav-list>
}
